<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pick a Sheep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a pasture — question on top, a big "stage" that grows the chosen sheep, five pens below, owner-only results hidden behind a button */
:root{
  --bg:#eef3e6; --surface:#fbfdf7; --ink:#1f2a1c; --muted:#5d6b57; --line:#cfdbc4;
  --accent:#3f7d3a; --accent-ink:#ffffff; --sel:#e9f4e3; --shadow:rgba(31,42,28,.18);
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a13; --surface:#1d251b; --ink:#e8efe2; --muted:#9fb096; --line:#2f3b2b;
  --accent:#7cc06f; --accent-ink:#0f1a0d; --sel:#243322; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a13; --surface:#1d251b; --ink:#e8efe2; --muted:#9fb096; --line:#2f3b2b;
  --accent:#7cc06f; --accent-ink:#0f1a0d; --sel:#243322; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-block:32px 48px;padding-inline:16px}
main{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1;margin:6px 0 10px;text-wrap:balance}
.lede{color:var(--muted);max-width:56ch;margin:0}

.stage{display:flex;justify-content:center}
.stage-inner{width:min(440px,100%);aspect-ratio:1;border-radius:22px;overflow:hidden;background:var(--surface);border:3px solid var(--accent);box-shadow:0 18px 40px var(--shadow)}
.stage-inner img{width:100%;height:100%;object-fit:cover;display:block}
.stage-inner.grow{animation:grow .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes grow{from{transform:scale(.55);opacity:.2}to{transform:scale(1);opacity:1}}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pen{background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:6px;cursor:pointer;font:inherit;color:inherit;
  transition:transform .3s cubic-bezier(.2,1.3,.4,1),border-color .2s,box-shadow .3s,opacity .2s}
.pen:hover{border-color:var(--accent)}
.pen:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pen img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.grid.has-pick .pen{opacity:.6}
.grid.has-pick .pen[aria-pressed="true"]{opacity:1;transform:scale(1.1);border-color:var(--accent);background:var(--sel);box-shadow:0 10px 24px var(--shadow);position:relative;z-index:1}

.form{display:flex;flex-direction:column;gap:10px;max-width:560px;width:100%;margin:0 auto}
label{font-weight:600}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:72px;resize:vertical;width:100%}
textarea:focus-visible{outline:none;border-color:var(--accent)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button.primary,button.ghost{font:inherit;font-weight:600;border-radius:999px;padding:10px 22px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border:0}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);padding:6px 16px;font-size:14px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.status{color:var(--muted);font-size:14px}

.owner{display:flex;flex-direction:column;gap:12px;align-items:flex-start;border-top:2px dashed var(--line);padding-top:20px}
.results{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;width:100%}
.results h2{font-family:var(--display);font-size:24px;margin:0}
.bar{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:15px}
.track{height:14px;background:var(--bg);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{border-left:3px solid var(--line);padding-left:10px}
.list li span{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.pen,.fill{transition:none}.stage-inner.grow{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Bugloos retro · before the session</div>
    <h1>Which sheep is the best?</h1>
    <p class="lede">Pick the one you like most. Go with your gut. One vote per person, and you can change it until the retro. Results will be revealed in the session.</p>
  </header>

  <section class="stage" id="stage" hidden aria-live="polite">
    <div class="stage-inner" id="stageInner"><img id="stageImg" alt="Your pick"></div>
  </section>

  <section class="grid" id="grid" aria-label="Sheep options"></section>

  <section class="form" id="form">
    <label for="why">Why this one? <span class="note">(optional, one line)</span></label>
    <textarea id="why" maxlength="200" placeholder="It just looks like a sheep should look…"></textarea>
    <div class="row">
      <button class="primary" id="submit" disabled>Vote</button>
      <span class="status" id="status" role="status">Choose a sheep first.</span>
    </div>
  </section>
</main>

const ORDER = ["fluffy","classic","box","ram","grandpa"];
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
};
let voter = store.get("sheep.voter");
if(!voter){ voter = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2)); store.set("sheep.voter", voter); }
let myVote = store.get("sheep.vote");
let choice = null;

ORDER.forEach((k,i)=>{
  const b=document.createElement("button");
  b.className="pen"; b.type="button"; b.id="pen-"+k;
  b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label","Sheep "+(i+1));
  b.innerHTML='<img src="'+S[k]+'" alt="" width="640" height="640">';
  b.addEventListener("click",()=>select(k));
  $("grid").appendChild(b);
});

function select(k, quiet){
  const changed = choice!==k; choice=k;
  $("grid").classList.add("has-pick");
  ORDER.forEach(o=>$("pen-"+o).setAttribute("aria-pressed",String(o===k)));
  $("stage").hidden=false; $("stageImg").src=S[k];
  if(changed){ const s=$("stageInner"); s.classList.remove("grow"); void s.offsetWidth; s.classList.add("grow"); }
  $("submit").disabled=false;
  if(!quiet) $("status").textContent = myVote ? (myVote.choice===k ? "This is your current vote." : "Press Update vote to switch.") : "Ready when you are.";
}

$("submit").addEventListener("click", async ()=>{
  if(!choice) return;
  const switched = !!(myVote && myVote.choice!==choice);
  const changes = (myVote ? myVote.changes||0 : 0) + (switched?1:0);
  const payload = {voter, choice, why:$("why").value.trim().slice(0,200), changes, previous: switched ? myVote.choice : ""};
  $("submit").disabled=true; $("status").textContent="Saving…";
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    myVote={choice, changes, why:payload.why}; store.set("sheep.vote", myVote);
    $("status").textContent = switched ? "Vote changed. Results at the retro." : "Thanks! Your vote is in. Results at the retro.";
    $("submit").textContent="Update vote";
  }catch(e){
    $("status").textContent="Couldn't send your vote. Check your connection and try again.";
  }finally{ $("submit").disabled=false; }
});

if(myVote && S[myVote.choice]){
  select(myVote.choice,true); $("why").value=myVote.why||"";
  $("submit").textContent="Update vote"; $("status").textContent="You've voted. You can change it until the retro.";
}
</script>
</body>
</html>
